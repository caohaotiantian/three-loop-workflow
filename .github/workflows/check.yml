name: check
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      # The acceptance script recomputes published figures from tags v1.14.0, v2.0.0 and v2.7.0 (and
      # v3.0.0 once it is tagged), so it needs full history and tags, not the default shallow
      # single-branch checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # accept-release.sh runs the syntax gate, lint-skill.sh and negative-test.sh itself.
      - name: Repository acceptance
        run: bash scripts/accept-release.sh
